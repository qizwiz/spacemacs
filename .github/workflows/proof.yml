name: Emacs Proofs

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Emacs
        uses: purcell/setup-emacs@v3
        with:
          version: '29.1'
      - name: Run make lint
        run: |
          make lint

  proofs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - name: Install Emacs
        uses: purcell/setup-emacs@v3
        with:
          version: '29.1'
      - name: Run make proof
        run: |
          make proof
