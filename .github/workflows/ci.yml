name: CI

on:
  push:
    paths:
      - ".spacemacs"
      - "lisp/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - ".spacemacs"
      - "lisp/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Install Emacs
        run: |
          sudo add-apt-repository -y ppa:kelleyk/emacs
          sudo apt-get update
          sudo apt-get install -y emacs29-nox
          emacs --version
      
      - name: Debug file structure
        run: |
          ls -la
          ls -la .github/workflows/
          ls -la lisp/
      
      - name: Run linter
        run: |
          make lint || echo "Linting failed"

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Install Emacs and dependencies
        run: |
          sudo add-apt-repository -y ppa:kelleyk/emacs
          sudo apt-get update
          sudo apt-get install -y emacs29-nox git
          emacs --version
      
      - name: Debug file structure
        run: |
          ls -la
          ls -la lisp/
          ls -la lisp/proofs/
      
      - name: Create minimal .spacemacs for testing
        run: |
          cat > ~/.spacemacs << 'EOL'
          (defun dotspacemacs/init ()
            (setq-default dotspacemacs-configuration-layers '()
                          dotspacemacs-additional-packages '()
                          dotspacemacs-install-packages 'used-but-keep-unused)
            (setq dotspacemacs-enable-lazy-installation 'all))
          (defun dotspacemacs/user-init ())
          (defun dotspacemacs/user-config ())
          EOL
      
      - name: Run tests with debug output
        run: |
          set -x
          make proof > proof.txt 2>&1 || (cat proof.txt && exit 1)
          cat proof.txt
          
          # Check for success or failure
          if grep -q 'All proofs passed' proof.txt; then
            echo "::notice::All proofs passed"
          else
            echo "::error::Some proofs failed"
            exit 1
          fi
