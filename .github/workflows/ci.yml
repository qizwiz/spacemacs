name: Codeium Integration Tests

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/ci.yml'
      - 'lisp/**'
      - 'Makefile'
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

env:
  EMACS: emacs
  EMACSFLAGS: "-Q -L $GITHUB_WORKSPACE/lisp -L $GITHUB_WORKSPACE/lisp/proofs"
  TEST_DIR: "/tmp/emacs-test"

jobs:
  codeium-tests:
    name: Run Codeium Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up environment
        run: |
          # Install Emacs and git
          echo "=== Installing dependencies ==="
          sudo apt-get update
          sudo apt-get install -y emacs-nox git
          
          # Show versions
          echo -n "Emacs version: "
          emacs --version
          echo -n "Git version: "
          git --version
      
      - name: Show file structure
        run: |
          echo "=== File Structure ==="
          ls -la
          echo "\n=== Lisp Directory ==="
          ls -la lisp/
          echo "\n=== Proofs Directory ==="
          ls -la lisp/proofs/
      
      - name: Create test directory structure
        run: |
          # Make the script executable
          chmod +x ./scripts/setup-test-env.sh
          # Show environment variables for debugging
          echo "=== Environment Variables ==="
          env | sort
          # Run the setup script with environment variables
          echo "=== Running setup script ==="
          TEST_DIR="/tmp/emacs-test" ./scripts/setup-test-env.sh
          # Verify the script created the expected files
          echo "=== Verifying setup ==="
          echo "Contents of $TEST_DIR:"
          ls -la "$TEST_DIR" || echo "Test directory not found"
          echo -e "\nContents of $TEST_DIR/lisp/proofs:"
          ls -la "$TEST_DIR/lisp/proofs" || echo "Proofs directory not found"
      
      - name: Run tests
        run: |
          echo "=== Running tests with Emacs ==="
          
          # Show the test directory contents
          echo -e "\n=== Test directory contents ==="
          find ${TEST_DIR} -type f | sort || true
          
          # Show the contents of the init file for debugging
          echo -e "\n=== Contents of init.el ==="
          cat ${TEST_DIR}/init.el
          
          # Change to the test directory and run Emacs with our minimal init file
          echo -e "\n=== Running Emacs tests ==="
          cd ${TEST_DIR}
          ${EMACS} -Q --batch -l init.el
          
          # Capture the exit status
          TEST_STATUS=$?
          
          if [ $TEST_STATUS -eq 0 ]; then
            echo "::notice::All tests passed"
          else
            echo "::error::Some tests failed"
            exit 1
          fi
        env:
          EMACS: emacs
          EMACSFLAGS: -Q -L ${{ github.workspace }}/lisp -L ${{ github.workspace }}/lisp/proofs
          TEST_DIR: "/tmp/emacs-test"
