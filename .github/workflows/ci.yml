name: Codeium Integration Tests

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/ci.yml'
      - 'lisp/**'
      - 'Makefile'
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

env:
  EMACS: emacs
  EMACSFLAGS: "-Q -l ~/.spacemacs --eval \"(dotspacemacs/user-config)\" -L ~/.emacs.d/lisp -L ~/.emacs.d/lisp/proofs"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up environment
        run: |
          # Install Emacs and git
          sudo apt-get update
          sudo apt-get install -y emacs-nox git
          
          # Show versions
          emacs --version
          git --version
          
          # Debug file structure
          echo "=== File Structure ==="
          ls -la
          echo "=== Lisp Directory ==="
          ls -la lisp/
          echo "=== Proofs Directory ==="
          ls -la lisp/proofs/
      
      - name: Create minimal .spacemacs
        run: |
          cat > ~/.spacemacs << 'EOL'
          (defun dotspacemacs/init ()
            (setq-default dotspacemacs-configuration-layers '()
                          dotspacemacs-additional-packages '()
                          dotspacemacs-install-packages 'used-but-keep-unused)
            (setq dotspacemacs-enable-lazy-installation 'all))
          (defun dotspacemacs/user-init ())
          (defun dotspacemacs/user-config ())
          EOL
          
          echo "=== .spacemacs created ==="
          cat ~/.spacemacs
      
      - name: Run linter
        run: |
          echo "=== Running linter ==="
          make lint || echo "Linting failed"
      
      - name: Run tests
        run: |
          echo "=== Running tests ==="
          set -x
          
          # Run the tests and capture output
          make proof > proof.txt 2>&1 || (cat proof.txt && exit 1)
          
          # Show test output
          cat proof.txt
          
          # Check for success
          if grep -q 'All proofs passed' proof.txt; then
            echo "::notice::All proofs passed"
          else
            echo "::error::Some proofs failed"
            exit 1
          fi
