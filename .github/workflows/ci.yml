name: Codeium Integration Tests

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/ci.yml'
      - 'lisp/**'
      - 'Makefile'
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

env:
  EMACS: emacs
  EMACSFLAGS: "-Q -L ~/.emacs.d/lisp -L ~/.emacs.d/lisp/proofs"

jobs:
  codeium-tests:
    name: Run Codeium Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up environment
        run: |
          # Install Emacs and git
          echo "=== Installing dependencies ==="
          sudo apt-get update
          sudo apt-get install -y emacs-nox git
          
          # Show versions
          echo -n "Emacs version: "
          emacs --version
          echo -n "Git version: "
          git --version
      
      - name: Show file structure
        run: |
          echo "=== File Structure ==="
          ls -la
          echo "\n=== Lisp Directory ==="
          ls -la lisp/
          echo "\n=== Proofs Directory ==="
          ls -la lisp/proofs/
      
      - name: Create test directory structure
        run: |
          # Create a test directory and copy our lisp files
          TEST_DIR="/tmp/emacs-test"
          mkdir -p $TEST_DIR/lisp/proofs
          
          # Copy lisp files if they exist
          if [ -d "lisp" ]; then
            cp -r lisp/* $TEST_DIR/lisp/ 2>/dev/null || true
            
            # Copy proof files if they exist
            if [ -d "lisp/proofs" ]; then
              cp -r lisp/proofs/* $TEST_DIR/lisp/proofs/ 2>/dev/null || true
            fi
          fi
          
          # Show the directory structure for debugging
          echo "=== Test directory structure ==="
          find $TEST_DIR -type f | sort || true
          
          # Print the contents of the init file we're about to create
          echo -e "\n=== Contents of init.el ==="
          cat > $TEST_DIR/init.el << 'EOL'
          ;; Minimal init file for Codeium tests
          (require 'package)
          (add-to-list 'package-archives '("melpa" . "https://melpa.org/packages/") t)
          (package-initialize)
          (unless (package-installed-p 'dash)
            (package-refresh-contents)
            (package-install 'dash))
          (require 'dash)
          
          ;; Add test directories to load path
          (add-to-list 'load-path "/tmp/emacs-test/lisp")
          (add-to-list 'load-path "/tmp/emacs-test/lisp/proofs")
          
          ;; Debug: Print load path and check if files exist
          (message "Current directory: %s" default-directory)
          (message "Load path: %S" load-path)
          (mapc (lambda (file)
                  (let ((found (locate-library file)))
                    (message "Checking for %s: %s" file (if found (concat "found at " found) "not found"))))
                '("proof-harness" "proof-commit-message" "proof-chat" 
                  "proof-explain-region" "proof-generate-docstring"))
          
          ;; Try to load proof harness
          (condition-case err
              (require 'proof-harness)
            (error 
             (message "Failed to load proof-harness: %s" (error-message-string err))
             (message "Trying to load files directly...")
             (load "proof-harness.el" nil t)))
          
          ;; Run the tests
          (setq proof-results nil)
          (mapc (lambda (proof) 
                  (condition-case err
                      (push (funcall proof) proof-results)
                    (error 
                     (push (format "ERROR in %s: %s" 
                                  (symbol-name proof) 
                                  (error-message-string err)) 
                           proof-results))))
                (list #'my/prove-commit-message
                      #'my/prove-chat
                      #'my/prove-explain-region
                      #'my/prove-generate-docstring))
          
          ;; Print results
          (princ "\n=== Test Results ===\n")
          (princ (mapconcat 'identity (reverse proof-results) "\n"))
          
          ;; Exit with appropriate status
          (if (seq-every-p (lambda (r) (string-match-p "PASS\|SKIP" r)) proof-results)
              (progn
                (princ "\n\nAll tests passed!")
                (kill-emacs 0))
            (princ "\n\nSome tests failed!")
            (kill-emacs 1))
          EOL
          
          # Show the contents of the init file
          echo -e "\n=== Contents of init.el ==="
          cat $TEST_DIR/init.el
          
          # Also create a symlink for backward compatibility
          ln -sf $TEST_DIR/init.el /tmp/init.el || true
          
          ;; Run the tests
          (setq proof-results nil)
          (mapc (lambda (proof) (push (funcall proof) proof-results))
                (list #'my/prove-commit-message
                      #'my/prove-chat
                      #'my/prove-explain-region
                      #'my/prove-generate-docstring))
          
          ;; Print results
          (princ "\n=== Test Results ===\n")
          (princ (mapconcat 'identity (reverse proof-results) "\n"))
          
          ;; Exit with appropriate status
          (if (seq-every-p (lambda (r) (string-match-p "PASS" r)) proof-results)
              (progn
                (princ "\n\nAll tests passed!")
                (kill-emacs 0))
            (princ "\n\nSome tests failed!")
            (kill-emacs 1))
          EOL
          
          echo "=== Init file created ==="
          cat /tmp/init.el
      
      - name: Run tests
        run: |
          echo "=== Running tests ==="
          set -x
          
          # Show the directory structure for debugging
          echo "=== Test directory structure ==="
          find /tmp/emacs-test -type f | sort || true
          
          # Check if the init file exists
          if [ ! -f "/tmp/emacs-test/init.el" ]; then
            echo "::error::Init file not found at /tmp/emacs-test/init.el"
            exit 1
          fi
          
          # Show the contents of the init file for debugging
          echo -e "\n=== Contents of init.el ==="
          cat /tmp/emacs-test/init.el
          
          # Change to the test directory and run Emacs with our minimal init file
          cd /tmp/emacs-test
          emacs -Q --batch -l init.el
          
          # Capture the exit status
          TEST_STATUS=$?
          
          if [ $TEST_STATUS -eq 0 ]; then
            echo "::notice::All tests passed"
          else
            echo "::error::Some tests failed"
            exit 1
          fi
