name: Codeium Integration Tests

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/ci.yml'
      - 'lisp/**'
      - 'Makefile'
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

env:
  EMACS: emacs
  EMACSFLAGS: "-Q -L /home/runner/work/spacemacs/spacemacs/lisp -L /home/runner/work/spacemacs/spacemacs/lisp/proofs"
  TEST_DIR: "/tmp/emacs-test"

jobs:
  codeium-tests:
    name: Run Codeium Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up environment
        run: |
          # Install Emacs and git
          echo "=== Installing dependencies ==="
          sudo apt-get update
          sudo apt-get install -y emacs-nox git
          
          # Show versions
          echo -n "Emacs version: "
          emacs --version
          echo -n "Git version: "
          git --version
      
      - name: Show file structure
        run: |
          echo "=== File Structure ==="
          ls -la
          echo "\n=== Lisp Directory ==="
          ls -la lisp/
          echo "\n=== Proofs Directory ==="
          ls -la lisp/proofs/
      
      - name: Create test directory structure
        run: |
          # Create test directory structure
          echo "=== Creating test directory structure ==="
          mkdir -p ${{ env.TEST_DIR }}/lisp/proofs
          
          # Copy lisp files if they exist
          if [ -d "lisp" ]; then
            echo "=== Copying lisp files to ${{ env.TEST_DIR }}/lisp/ ==="
            cp -r lisp/* ${{ env.TEST_DIR }}/lisp/ 2>/dev/null || true
            
            # Copy proof files if they exist
            if [ -d "lisp/proofs" ]; then
              echo "=== Copying proof files to ${{ env.TEST_DIR }}/lisp/proofs/ ==="
              cp -r lisp/proofs/* ${{ env.TEST_DIR }}/lisp/proofs/ 2>/dev/null || true
            fi
          fi
          
          # Copy the init file from the repository
          echo -e "\n=== Copying init file to ${{ env.TEST_DIR }}/init.el ==="
          mkdir -p ${{ env.TEST_DIR }}
          cp tests/config/init-test.el ${{ env.TEST_DIR }}/init.el
          
          # Show the directory structure for debugging
          echo -e "\n=== Test directory structure ==="
          find ${{ env.TEST_DIR }} -type f | sort || true
          
          # Verify the init file was copied
          echo -e "\n=== Init file contents ==="
          cat ${{ env.TEST_DIR }}/init.el
      
      - name: Run tests
        run: |
          echo "=== Running tests with Emacs ==="
          
          # Create the test directory if it doesn't exist
          mkdir -p ${TEST_DIR}
          
          # Copy the init file to the test directory
          echo "=== Copying init file to ${TEST_DIR}/init.el ==="
          cp tests/config/init-test.el ${TEST_DIR}/init.el
          
          # Show the test directory contents
          echo -e "\n=== Test directory contents ==="
          ls -la ${TEST_DIR}/
          
          # Show the contents of the init file for debugging
          echo -e "\n=== Contents of init.el ==="
          cat ${TEST_DIR}/init.el
          
          # Change to the test directory and run Emacs with our minimal init file
          echo -e "\n=== Running Emacs tests ==="
          cd ${TEST_DIR}
          ${EMACS} -Q --batch -l init.el
          
          # Capture the exit status
          TEST_STATUS=$?
          
          if [ $TEST_STATUS -eq 0 ]; then
            echo "::notice::All tests passed"
          else
            echo "::error::Some tests failed"
            exit 1
          fi
        env:
          EMACS: emacs
          EMACSFLAGS: -Q -L ~/.emacs.d/lisp -L ~/.emacs.d/lisp/proofs
          TEST_DIR: "/tmp/emacs-test"
