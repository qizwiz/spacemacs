name: CI

on:
  push:
    paths:
      - ".spacemacs"
      - "lisp/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - ".spacemacs"
      - "lisp/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Install Emacs
        run: |
          sudo add-apt-repository -y ppa:kelleyk/emacs
          sudo apt-get update
          sudo apt-get install -y emacs29-nox
      
      - name: Run linter
        run: make lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Install Emacs
        run: |
          sudo add-apt-repository -y ppa:kelleyk/emacs
          sudo apt-get update
          sudo apt-get install -y emacs29-nox
      
      - name: Run tests
        run: |
          make proof > proof.txt 2>&1 || (cat proof.txt && exit 1)
          cat proof.txt
          
          # Verify proof output contains expected results
          if ! grep -q 'All proofs passed' proof.txt; then
            echo "::error::Some proofs failed"
            exit 1
          fi
